name: Deployment pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  validate:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Linter (ESlint)
        run: npm run lint

      - name: Validate types and compile (tsc -b && vite build)
        run: npm run build

      - name: Execute Unit Tests (Vitest)
        run: npx vitest run

  e2e:
    name: End-to-End Test (Playwright)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers with system dependencies
        run: npx playwright install --with-deps

      - name: Execute E2E tests
        run: npx playwright test

      - name: HTML report if test fails
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy & Release Artifacts
    needs: [validate, e2e]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile for production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build

      - name: Package Browser Extension (.zip)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd dist
          zip -r ../clipsync-extension.zip .

      - name: Extract extension version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: get_version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: "ClipSync Extension v${{ steps.get_version.outputs.version }}"
          body: |
            ## 🚀 ClipSync Chrome Extension v${{ steps.get_version.outputs.version }}

            ### 📦 ¿Cómo instalar la extensión en Google Chrome / Brave / Edge?
            1. Descarga el archivo **`clipsync-extension.zip`** desde la sección de **Assets** aquí abajo.
            2. Descomprímelo en tu computadora.
            3. Abre tu navegador y ve a `chrome://extensions/` (o `edge://extensions/`).
            4. Activa el interruptor **Modo de desarrollador** (en la esquina superior derecha).
            5. Haz clic en **Cargar descomprimida** (*Load unpacked*).
            6. Selecciona la carpeta que acabas de descomprimir. ¡Y listo! 🎉
          files: clipsync-extension.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Extension Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: clipsync-extension
          path: clipsync-extension.zip
          retention-days: 30


      - name: Install Vercel CLI
        run: |
          npm install --global vercel@latest
          echo "Vercel CLI installed successfully"

      # PREVIEW

      - name: Pull Vercel Environment Information (Preview)
        if: github.event_name == 'pull_request'
        run: |
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          echo "Vercel Environment Information pulled successfully"

      - name: Build Project Artifacts (Preview)
        if: github.event_name == 'pull_request'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel (Preview)
        if: github.event_name == 'pull_request'
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

        # Production

      - name: Pull Vercel Environment Information (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --debug
          echo "Vercel Environment Information pulled successfully"

      - name: Build Project Artifacts (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          echo "Project Artifacts built successfully"

      - name: Deploy Project Artifacts to Vercel (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          echo "Project Artifacts deployed successfully 🚀"
